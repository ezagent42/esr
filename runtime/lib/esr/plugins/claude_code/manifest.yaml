# Claude Code plugin manifest.
#
# PtyProcess stays in core (generic mechanism). The cc plugin spawns
# a PtyProcess for its claude binary by calling
# `Esr.Entity.PtyProcess.start_link(cmd: ...)` — no plugin-specific
# extension required.
#
# Spec: docs/superpowers/specs/2026-05-04-plugin-mechanism-design.md §四.

name: claude_code
version: 0.1.0
hot_reloadable: true

# Top-level `channels:` block — populated by Esr.Plugin.Loader at boot
# into Esr.Channel.Registry under `claude_code.mcp_stdio`. The module
# wraps the existing EsrWeb.McpController + `cli:channel/<sid>` PubSub
# plumbing under the Esr.Channel behaviour; SessionTemplate loaders
# (Phase 4) instantiate one per session. Spec
# 2026-05-10-session-template-and-channel.md, Phase 2.
channels:
  - name: mcp_stdio
    module: Esr.Plugins.ClaudeCode.Channels.Mcp
    config_schema:
      type: object
      properties:
        port:
          type: integer

# Top-level `agent_kinds:` block — populated by Esr.Plugin.Loader at
# boot into Esr.Plugin.AgentKindRegistry under `claude_code.cc`.
# Replaces the legacy `${ESRD_HOME}/<inst>/agents.yaml` `cc` entry
# (deleted in Phase 6, 2026-05-10).
#
# The `cc` kind contributes the canonical CC chain to the inbound
# pipeline: cc_proxy → cc_process → pty_process. Channel
# contributions (e.g. feishu_chat_proxy from feishu's chat_proxy
# Channel + feishu_app_proxy from the feishu plugin's proxy block)
# are added at template-materialization time by
# `Esr.SessionTemplate.AgentDefBuilder` based on the SessionTemplate's
# declared `channels:`.
#
# `handler_module: cc_adapter_runner` surfaces the legacy Python
# handler module name (`handler:cc_adapter_runner/...` capability
# entries) so `Esr.Application.restore_handlers_from_disk/1` can
# spawn it at boot from the plugin registry rather than parsing
# agents.yaml.
agent_kinds:
  - name: cc
    description: "Claude Code"
    handler_module: cc_adapter_runner
    capabilities_required:
      - session:default/create
      - pty:default/spawn
      - handler:cc_adapter_runner/invoke
    pipeline:
      inbound:
        - { name: cc_proxy,    impl: Esr.Entity.CCProxy }
        - { name: cc_process,  impl: Esr.Entity.CCProcess }
        - { name: pty_process, impl: Esr.Entity.PtyProcess }
      outbound:
        - pty_process
        - cc_process
        - cc_proxy
    params:
      - { name: dir,    required: true,  type: path }
      - { name: app_id, required: false, default: "default", type: string }

description: |
  Claude Code (CC) integration. CCProcess drives session lifecycle;
  CCProxy streams reply directives. Spawns a claude binary inside a
  core-provided PtyProcess; the cc agent_kind (above) wires the
  per-plugin pipeline contribution (cc_proxy → cc_process →
  pty_process). The MCP server claude uses to push notifications
  and accept tool calls is hosted by `EsrWeb.McpController`
  (PR-3.5, 2026-05-05) — no separate Python sidecar; .mcp.json
  points claude at the esrd HTTP endpoint directly.

depends_on:
  core: ">= 0.1.0"
  plugins: []

declares:
  # Injection #5 — Entity modules.
  entities:
    - module: Esr.Entity.CCProcess
      kind: stateful
    - module: Esr.Entity.CCProxy
      kind: proxy

  # No python_sidecars — PR-3.5 (2026-05-05) deleted adapters/cc_mcp/.
  # The MCP server is now esrd-hosted (Elixir, EsrWeb.McpController).

  # Multi-media content protocol participation (per spec
  # 2026-05-08-multimedia-content-protocol-design.md §4.1, D5).
  # Block is OPTIONAL — claude_code opts in for image+file inbound/outbound.
  # Audio/video/interactive deferred to follow-up specs.
  media_types:
    inbound:  [image, file]
    outbound: [image, file]

  # Phase E (resource-typed grammar rev-4 D5 + §4.4): /claude_code:tui ships
  # in the claude_code plugin via the rev-3 plugin-scoped command
  # registration mechanism. Validator (`Esr.Plugin.Manifest.validate/1` —
  # see `runtime/lib/esr/plugin/manifest.ex:340-399`) enforces:
  #   * slash key starts with "/<plugin_name>:" → "/claude_code:tui"
  #   * kind name starts with "<plugin_name>_"   → "claude_code_tui"
  #   * command_module under "Esr.Plugins.ClaudeCode."
  #
  # `/claude_code:tui` is a thin shortcut around `/pty:attach`: it
  # resolves agent name → pty_actor_id via the chat-current session,
  # then delegates. Permission `null` (chat-bound; auth gates the
  # underlying URL out-of-scope per spec rev-2 D3, tracked in
  # docs/futures/todo.md as `pty_attach_security_hardening`).
  slash_routes:
    schema_version: 1
    slashes:
      "/claude_code:tui":
        kind: claude_code_tui
        permission: null
        command_module: "Esr.Plugins.ClaudeCode.Commands.Tui"
        requires_workspace_binding: false
        requires_user_binding: true
        category: "Plugins"
        description: "把当前 chat 的 session 内某 cc agent 的 PTY URL 发回（/pty:attach 的薄壳 shortcut）"
        args:
          - { name: name, required: true }
    internal_kinds: {}

config_schema:
  http_proxy:
    type: string
    description: "HTTP proxy URL for outbound Anthropic API requests. Empty string = no proxy."
    default: ""

  https_proxy:
    type: string
    description: "HTTPS proxy URL. Usually same as http_proxy."
    default: ""

  no_proxy:
    type: string
    description: "Comma-separated host/suffix list that bypasses the proxy."
    default: ""

  anthropic_api_key_ref:
    type: string
    description: "Env-var reference for the Anthropic API key, e.g. ${ANTHROPIC_API_KEY}. Resolved via System.get_env/1 at session-start."
    default: "${ANTHROPIC_API_KEY}"

  esrd_url:
    type: string
    description: "WebSocket URL of the esrd host. Controls the HTTP MCP endpoint."
    default: "ws://127.0.0.1:4001"

  claude_binary:
    type: string
    description: "Path to the claude binary (or a mock binary for e2e tests). Defaults to the system 'claude' found at compile time."
    default: ""
