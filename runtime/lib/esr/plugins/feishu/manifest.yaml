# Feishu plugin manifest (Track 2, plugin extraction Phase 1).
#
# Phase 1 (this commit): manifest declares what's already in core.
# Modules listed below currently live under runtime/lib/esr/entity/
# and py/src/feishu_*. Operators see this plugin in `/plugin list`.
#
# Phase 2 (deferred): physical code move + remove feishu-specific
# modules from core's compile path. The feishu sidecar mapping
# (`feishu → feishu_adapter_runner`) currently lives in core as a
# Phase-1 fallback in Esr.Application.start/2; Phase 2 moves it here
# and removes the fallback.
#
# Spec: docs/superpowers/specs/2026-05-04-plugin-mechanism-design.md §四.
#
# Phase 7.D (2026-05-08): app_id + app_secret moved out of plugin
# config_schema and into per-instance adapters.yaml `config:`. They
# are inherently per-Feishu-bot identity attributes (one (app_id,
# app_secret) pair per Lark App), not plugin-wide settings. Plugin
# config now retains only truly plugin-wide knobs (log_level).

name: feishu
version: 0.1.0
hot_reloadable: true
description: |
  Feishu (Lark) chat platform integration. Provides webhook adapter
  (FeishuAppAdapter), per-chat proxy (FeishuChatProxy), per-app proxy
  (FeishuAppProxy), and the feishu_adapter_runner Python sidecar.

# Top-level `channels:` block — populated by Esr.Plugin.Loader at boot
# into Esr.Channel.Registry under `feishu.chat_proxy`. The module is the
# addressable Channel lifecycle peer (per `Esr.Channel` behaviour); FCP
# itself keeps its agent-router half + current message handling
# unchanged. SessionTemplate loaders (Phase 4) instantiate one ChatProxy
# Channel per session. Spec
# 2026-05-10-session-template-and-channel.md, Phase 3.
# Top-level `uri_subtrees:` block — registered by Esr.Plugin.Loader at
# boot into `:persistent_term {Esr.Uri, :plugin_handlers}`. The feishu
# plugin owns the `users/feishu/<ou_xxx>` URI subtree. Spec:
# docs/superpowers/specs/2026-05-12-uri-identity-design.md §6.
uri_subtrees:
  - prefix: "users/feishu"
    handler: Esr.Plugins.Feishu.UriHandler

channels:
  - name: chat_proxy
    module: Esr.Plugins.Feishu.Channels.ChatProxy
    config_schema:
      type: object
      properties: {}
    # Phase 6 (2026-05-10): channel-contributed pipeline peers.
    # `Esr.SessionTemplate.AgentDefBuilder` reads these when a
    # SessionTemplate references `feishu.chat_proxy` and stitches them
    # into the materialized agent_def's `pipeline.inbound`. Pre-Phase-6
    # these were hardcoded inside AgentDefBuilder.
    pipeline_contributions:
      - { name: feishu_chat_proxy, impl: Esr.Plugins.Feishu.FeishuChatProxy }
    # Stateless proxy peers contributed alongside the chat_proxy
    # channel. The `${app_id}` literal is left intact for downstream
    # `Esr.Session.AgentSpawner.build_ctx/2` to substitute at spawn
    # time (it reads `params[:app_id]`).
    proxies:
      - name: feishu_app_proxy
        impl: Esr.Entity.FeishuAppProxy
        target: "admin::feishu_app_adapter_${app_id}"

depends_on:
  core: ">= 0.1.0"
  plugins: []

declares:
  # Injection #5 — Entity modules.
  #
  # Phase D-1 (2026-05-05): FeishuChatProxy reclassified `proxy` →
  # `stateful` to match its actual implementation (`use GenServer`,
  # `use Esr.Entity.Stateful` — per-session pid, not a stateless
  # forwarding shim). Pre-fix the mis-classification was masked by a
  # hardcoded `StatefulRegistry.register/1` call in core's
  # `Esr.Application.start/2`; the same PR deletes that fallback so
  # the Loader is the canonical source for ALL of feishu's stateful
  # peers, no core hardcode behind it.
  entities:
    - module: Esr.Entity.FeishuAppAdapter
      kind: stateful
    - module: Esr.Plugins.Feishu.FeishuChatProxy
      kind: stateful
    - module: Esr.Entity.FeishuAppProxy
      kind: proxy

  # Injection #12 — python sidecar. Phase 1 keeps the fallback
  # registration in core's Application.start/2; documenting here so
  # Phase 2 can flip the source-of-truth without surface churn.
  python_sidecars:
    - adapter_type: feishu
      python_module: feishu_adapter_runner

  # PR-3.4 (2026-05-05): startup hook. `Esr.Plugin.Loader.run_startup/0`
  # invokes this after `restore_adapters_from_disk/1` at boot. Both
  # `module:` and `function:` are required (no defaults — manifest typos
  # raise during register_startup/1). The function spawns one
  # FeishuAppAdapter peer per `type: feishu` row in adapters.yaml.
  startup:
    module: Esr.Plugins.Feishu.Bootstrap
    function: bootstrap

  capabilities:
    - feishu/notify-send
    - feishu/user-bind

  # Audit #6 rev-3 (2026-05-08-plugin-command-registration spec §5.5):
  # 3 plugin-owned commands migrated from core under the rev-3 naming
  # contract (kind names rename to <plugin>_<verb>; cap names rename
  # to <plugin>/<rest>). Old kind names: notify, user_bind_feishu,
  # user_unbind_feishu. New: feishu_notify, feishu_bind, feishu_unbind.
  slash_routes:
    schema_version: 1
    slashes:
      "/feishu:bind":
        kind: feishu_self_bind
        permission: null
        command_module: "Esr.Plugins.Feishu.Commands.SelfBind"
        requires_workspace_binding: false
        requires_user_binding: false
        category: "Users"
        description: "把当前 Feishu 账号绑到一个 esr user (admin 须先创建该 user)"
        args:
          - { name: name, required: true }

      "/feishu:unbind":
        kind: feishu_self_unbind
        permission: null
        command_module: "Esr.Plugins.Feishu.Commands.SelfUnbind"
        requires_workspace_binding: false
        requires_user_binding: false
        category: "Users"
        description: "把当前 Feishu 账号从绑定的 esr user 上解绑"
        args: []

    internal_kinds:
      feishu_notify:
        permission: "feishu/notify-send"
        command_module: "Esr.Plugins.Feishu.Commands.Notify"
      feishu_bind:
        permission: "feishu/user-bind"
        command_module: "Esr.Plugins.Feishu.Commands.BindUser"
      feishu_unbind:
        permission: "feishu/user-bind"
        command_module: "Esr.Plugins.Feishu.Commands.UnbindUser"
      feishu_self_bind:
        permission: null
        command_module: "Esr.Plugins.Feishu.Commands.SelfBind"
      feishu_self_unbind:
        permission: null
        command_module: "Esr.Plugins.Feishu.Commands.SelfUnbind"

  # Multi-media content protocol participation (per spec
  # 2026-05-08-multimedia-content-protocol-design.md §4.1, D5).
  # Block is OPTIONAL — feishu opts in for image+file inbound/outbound.
  # Audio/video/interactive deferred to follow-up specs.
  media_types:
    inbound:  [image, file]
    outbound: [image, file]

config_schema:
  log_level:
    type: string
    description: "Log verbosity for the feishu adapter (debug|info|warning|error). Forwarded to the Python sidecar at spawn time; restart sidecar to apply."
    default: "info"

  # NOTE: app_id and app_secret were previously declared here. As of Phase 7.D
  # (2026-05-08) they live in per-instance `adapters.yaml`:
  #   instances.<id>.config.app_id
  #   instances.<id>.config.app_secret
  # See docs/notes/2026-05-09-cold-start-walkthrough-1.md C2 entry.
