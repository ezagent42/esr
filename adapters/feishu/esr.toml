# ESR adapter manifest (PRD 04 F04)
name = "feishu"
version = "0.1.0"
module = "esr_feishu.adapter"
entry = "FeishuAdapter"

[allowed_io]
lark_oapi = "*"
aiohttp = "*"
http = ["open.feishu.cn"]
urllib = ["127.0.0.1", "localhost"]
base64 = "*"
hashlib = "*"

[media_types]
# Mirror of runtime/lib/esr/plugins/feishu/manifest.yaml
# declares.media_types. Cross-check enforced in CI per spec
# 2026-05-08-multimedia-content-protocol-design.md §4.2.
inbound  = ["image", "file"]
outbound = ["image", "file"]
