<text x="40" y="41.099999999999994" font-size="18" fill="#555" text-anchor="start" font-weight="600">ESR — core components + flow  (origin/dev, 2026-05-13)</text>
<rect x="60" y="90" width="200" height="80" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="160.0" y="137.0" font-size="20" fill="#111" text-anchor="middle" font-weight="600">Plugin Loader</text>
<rect x="330" y="70" width="580" height="250" rx="10" fill="#fffbf0" stroke="#a78a00" stroke-width="2"/>
<text x="620.0" y="199.3" font-size="14" fill="#111" text-anchor="middle" font-weight="400"></text>
<text x="620.0" y="97.3" font-size="14" fill="#a78a00" text-anchor="middle" font-weight="400">what a plugin contributes  (manifest.yaml)</text>
<text x="350" y="128.35" font-size="13" fill="#333" text-anchor="start" font-weight="400">•  capabilities          →  Permission.Registry</text>
<text x="350" y="148.35" font-size="13" fill="#333" text-anchor="start" font-weight="400">•  python_sidecars       →  Sidecar.Registry      (adapter+handler workers)</text>
<text x="350" y="168.35" font-size="13" fill="#333" text-anchor="start" font-weight="400">•  entities              →  Agent.StatefulRegistry  (peer types, e.g. PtyProcess)</text>
<text x="350" y="188.35" font-size="13" fill="#333" text-anchor="start" font-weight="400">•  channels              →  Channel.Registry</text>
<text x="350" y="208.35" font-size="13" fill="#333" text-anchor="start" font-weight="400">•  agent_kinds           →  Plugin.AgentKindRegistry</text>
<text x="350" y="228.35" font-size="13" fill="#333" text-anchor="start" font-weight="400">•  slash_routes          →  SlashRoute.Registry</text>
<text x="350" y="248.35" font-size="13" fill="#333" text-anchor="start" font-weight="400">•  media_types           →  Media.PluginRegistry</text>
<text x="350" y="268.35" font-size="13" fill="#333" text-anchor="start" font-weight="400">•  uri_subtrees          →  Esr.Uri  (resolve fallback)</text>
<text x="350" y="288.35" font-size="13" fill="#333" text-anchor="start" font-weight="400">•  startup callbacks     →  :persistent_term</text>
<text x="620.0" y="307.4" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="400">note: SessionTemplate is shipped by Bundles or inline yaml, not by plugins</text>
<rect x="960" y="90" width="220" height="100" rx="10" fill="#fde7ec" stroke="#b91c1c" stroke-width="2"/>
