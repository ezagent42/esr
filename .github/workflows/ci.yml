name: CI

# Phase 5 of the unified-command-grammar migration (spec
# docs/superpowers/specs/2026-05-09-unified-command-grammar-and-errors.md).
# Today's only workflow (enforce-pr-from-dev.yml) is a base-branch check;
# this is the actual build/test/grammar-drift gate.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/verify-e2e-report.sh runs `git log origin/dev..HEAD`
          # to find PR commits touching command handlers. Default
          # fetch-depth=1 doesn't include base ref history.
          fetch-depth: 0

      - name: Install inotify-tools
        # Esr.Resource.SlashRoute.Registry.Watcher uses the `:file_system`
        # package, which backs onto inotify on Linux. Without these tools,
        # FileSystem.start_link/1 returns :ignore → MatchError on watcher
        # init when the test suite boots the supervision tree. macOS uses
        # FSEvents (built in); Ubuntu needs apt.
        run: sudo apt-get update && sudo apt-get install -y inotify-tools

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '27'

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            runtime/deps
            runtime/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('runtime/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Fetch deps
        working-directory: runtime
        run: mix deps.get

      - name: Compile
        working-directory: runtime
        run: mix compile

      - name: Check command docs (grammar drift gate)
        working-directory: runtime
        run: mix esr.check_command_docs

      - name: Check URI drift (PR-0 Task 0.6 L1' path-pattern gate)
        # Spec: docs/superpowers/specs/2026-05-12-uri-identity-spec.md §10.
        # Bans legacy identity-lookup API uses (User.Registry / NameIndex /
        # Workspace.Registry / InstanceRegistry.primary / ...) outside
        # runtime/lib/esr/uri/**, runtime/lib/esr/uri.ex, and
        # runtime/lib/esr/plugins/*/uri_handler.ex. Each migration PR
        # ratchets runtime/priv/uri-drift-baseline.txt down.
        working-directory: runtime
        run: mix esr.check_uri_drift

      - name: Check bundles (SessionTemplate + Channel migration drift gate)
        # Phase 8 Task 8.4 of spec
        # docs/superpowers/specs/2026-05-10-session-template-and-channel.md §10
        # acceptance "CI gate: a template referencing a missing channel kind
        # fails CI." Walks runtime/lib/esr/bundles/*/ + plugins/*/manifest.yaml
        # statically; no esrd boot required.
        working-directory: runtime
        run: mix esr.check_bundles

      - name: Supervisor audit drift gate (PR-3 Task 3.10)
        # Boots app, snapshots every named supervisor reachable from the
        # @roots list, and diffs against docs/notes/supervisor-inventory.md.
        # Non-empty diff exits 1; regenerate the baseline with
        # `cd runtime && mix esr.audit_supervision --write=../docs/notes/supervisor-inventory.md`.
        working-directory: runtime
        run: mix esr.audit_supervision

      - name: Routing-layer catch-all grep gate (PR-3 invariant I5)
        # Static gate over the routing-layer files: any `other -> Logger.warning`
        # catch-all is forbidden because it silently drops envelopes the
        # operator never sees an error for. Every case clause must be
        # exhaustive on the upstream contract (current_session/2 → {:ok, sid} | :not_found,
        # ActorQuery.fcp_for_session/1 → {:ok, pid} | :not_found, etc.).
        # See docs/notes/system-invariants.md row I5.
        run: |
          set -e
          files=(
            runtime/lib/esr/plugins/feishu/feishu_app_adapter.ex
            runtime/lib/esr/session/router.ex
            runtime/lib/esr/entity/slash_handler.ex
          )
          # `grep -v '^[[:space:]]*#'` strips comment-only lines so the gate
          # doesn't fire on text that documents the rule.
          hits=$(grep -hn 'other -> Logger\.warning' "${files[@]}" 2>/dev/null \
                  | grep -v '^[[:space:]]*[0-9]*:[[:space:]]*#' || true)
          if [ -n "$hits" ]; then
            echo "FAIL: routing-layer code retains 'other -> Logger.warning' catch-all (I5):"
            echo "$hits"
            exit 1
          fi
          echo "PASS: I5 grep gate"

      - name: Lint scenario headers
        run: bash scripts/check-scenario-headers.sh

      - name: Verify e2e report
        # Anti-drift gate per spec §3.7. Report-based instead of CI-runs-replay
        # because Ubuntu CI cannot spawn the FAA Python sidecar; ESR's only
        # production target is macOS. Developers run scripts/generate-e2e-report.sh
        # locally and commit docs/e2e-reports/<short-sha>.md. This step only
        # enforces presence + freshness — see scripts/verify-e2e-report.sh.
        run: bash scripts/verify-e2e-report.sh

      # TODO(2026-05-09): mix test on Linux CI fails ~22 of 1436 tests
      # for reasons unrelated to this migration:
      #   - `claude` CLI not on PATH (used by PTY spawn in some tests)
      #   - Test isolation bugs that surface only when ordering differs
      #     from macOS dev (these are real bugs but pre-existing)
      #   - YAML fixture parse errors expected in some cap tests
      # Tests pass locally on macOS. Triaging these for Linux CI is a
      # followup PR; the grammar drift gate above is the load-bearing
      # check this workflow ships. When the suite is Linux-clean, add:
      #
      #   - name: Run tests
      #     working-directory: runtime
      #     run: mix test
      #
      # Tracking: docs/futures/todo.md "CI mix test on Linux".

  # PR-4 (2026-05-11 default-agent + agent-driven-flow plan §5.4):
  # opt-in real-claude integration test. Runs on macos-latest because
  # ESR's only production target is macOS and the `claude` binary
  # currently has no stable Linux install path. The test is tagged
  # `:real_claude` and is excluded from the default run; this job opts
  # in via `--only real_claude`.
  #
  # If `claude` is not present on the runner (no install step that we
  # can rely on yet), the moduletag setup short-circuits and the test
  # logs a skip — so the job stays green either way. When/if a
  # claude-install action lands, drop the install step here and the
  # job will start asserting the real boot pipeline.
  real-claude-integration:
    runs-on: macos-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '27'

      - name: Probe for claude binary
        run: |
          if command -v claude > /dev/null 2>&1; then
            echo "claude is on PATH at: $(command -v claude)"
          else
            echo "claude not on PATH — :real_claude setup will skip"
          fi

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            runtime/deps
            runtime/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('runtime/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Fetch deps
        working-directory: runtime
        run: mix deps.get

      - name: Compile
        working-directory: runtime
        run: mix compile

      - name: Run real-claude integration test
        working-directory: runtime
        run: mix test --only real_claude
